harvest_only_note: >-
  Records what Macquarie Group publishes on its own legal/trust pages. It does not decide
  which regimes apply. The dossier's two macquarie.com.au legal pointers
  (/privacy-and-security.html, /terms-and-conditions.html) returned "Page not found", and
  other macquarie.com.au paths answered 403 to a plain fetch; the group-wide Privacy Policy on
  www.macquarie.com (which also covers the CDR policy contact and Macquarie Bank) was read instead.
summary: >-
  The Macquarie Group Privacy Policy covers access and correction requests, a data-breach
  notification commitment (including 72 hours under GDPR), cross-border disclosure with a
  list of countries, cloud storage outside the country of collection, purpose-bound retention,
  and that personal data may feed ML/AI scoring and risk tools. The Accessibility page commits
  to WCAG 2.1 AA over time and links an Accessibility Action Plan 2025-2028. The policy names
  categories of service providers, not a named subprocessor list. The Cybersecurity disclosure
  describes internal incident management, not customer notification. The pages read do not
  mention Global Privacy Control, an SBOM, a transparency report or exit assistance.

  limit_text: "10 TPS per customer"
  max: 10
  window: 1 second
  scope: per-customer
  traffic: Customer Present and authorisation
- name: customer-present-per-software-product
  limit_text: "50 TPS per Data Recipient Software Product"
  max: 50
  window: 1 second
  scope: per-data-recipient-software-product
  traffic: Customer Present and authorisation
- name: customer-present-sessions
  limit_text: "Unlimited sessions per day"
  scope: per-customer
  traffic: Customer Present and authorisation
- name: unattended-sessions-per-day
  limit_text: "20 sessions per day, per customer, per Data Recipient Software Product"
  max: 20
  window: 1 day
  scope: per-customer-per-data-recipient-software-product
  traffic: Unattended (low traffic periods)
- name: unattended-calls-per-session
  limit_text: "100 total calls per session"
  max: 100
  scope: per-session
  traffic: Unattended (low traffic periods)
- name: unattended-tps-per-session
  limit_text: "5TPS per session"
  max: 5
  window: 1 second
  scope: per-session
  traffic: Unattended (low traffic periods)
- name: unattended-tps-per-software-product
  limit_text: "50 TPS per Data Recipient Software Product"
  max: 50
  window: 1 second
  scope: per-data-recipient-software-product
  traffic: Unattended (low traffic periods)
- name: unattended-high-traffic
  limit_text: "For Unattended traffic during high traffic periods only best effort support is required."

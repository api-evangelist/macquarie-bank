name: Macquarie Bank rate limits
generated: '2026-10-20'
method: searched
source: https://consumerdatastandardsaustralia.github.io/standards/
note: >-
  Macquarie Bank publishes no rate limits of its own (its developer portal at
  developer.macquariebank.io returns 403 to unauthenticated clients). As a CDR data
  holder it is bound by the Consumer Data Standards Non-functional Requirements
  "Traffic Thresholds", quoted verbatim below; calls above these thresholds may be
  throttled or rejected by the data holder. A live unauthenticated GET of
  https://api.macquariebank.io/cds-au/v1/banking/products (2026-10-20, 200) returned no
  RateLimit-* / X-RateLimit-* headers.
limit_count: 13
signaling:
  status_code: 429
  status_text: "The operation was refused as too many requests have been made within a certain timeframe."
  headers:
  - name: Retry-After
    required: optional
    text: "Header indicating the time (in seconds) that the client should wait before retrying an operation."
  observed_live_headers: []
limits:

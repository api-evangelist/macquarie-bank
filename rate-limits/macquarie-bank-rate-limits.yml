  traffic: Unattended (high traffic periods)
- name: secure-traffic-peak-0-10000
  limit_text: "For Data Holders with 0 to 10,000 active authorisations, 150 peak TPS total across all consumers."
  max: 150
  window: 1 second
  scope: per-data-holder
  kind: burst
- name: secure-traffic-peak-over-60000
  limit_text: "For Data Holders with more than 60,000 active authorisations, 450 peak TPS total across all consumers."
  max: 450
  window: 1 second
  scope: per-data-holder
  kind: burst
  note: Intermediate bands step by 50 TPS per 10,000 authorisations (200, 250, 300, 350, 400); which band applies to Macquarie is not published.
- name: secure-traffic-peak-10001-20000
  limit_text: "For Data Holders with 10,001 to 20,000 active authorisations, 200 peak TPS total across all consumers."
  max: 200
  window: 1 second

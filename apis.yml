    type: DeveloperPortal
  - url: https://www.macquarie.com.au/help/business/manage-your-accounts/data-sharing-and-integration/macquarie-connectivity-solutions.html
    type: Documentation
  description: Macquarie's connectivity / data APIs for business, documented through the registered Macquarie developer portal, let approved businesses
    and software partners automate account information retrieval and payment operations (balances, transaction history, payment automation) as
    an alternative to file-based banking. Partner-gated - access, credentials and the OpenAPI/Swagger reference are only available after registration
    and approval through the developer portal (the portal is edge-protected and returns HTTP 403 to unauthenticated requests); no public, downloadable
    spec is published, so none is fabricated here.
